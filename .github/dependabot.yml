version: 2
updates:
  # Thư viện npm: chỉ tự đề xuất bản vá và bản nhỏ (gộp thành một PR). Bản LỚN (TypeScript, ESLint, nodemailer…) có thể làm hỏng dự án nên
  # nâng thủ công khi cần, kèm chạy đủ test: bỏ khỏi danh sách `ignore` này khi muốn nhận lại.
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # GitHub Actions: nhận cả bản lớn (hay là nâng phiên bản Node của action), mỗi PR phải qua CI mới gộp
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
