version: 2
# Dự án ở chế độ chỉ công khai (không phát triển thêm): TẮT đề xuất nâng phiên bản định kỳ (open-pull-requests-limit: 0).
# Cảnh báo và PR cập nhật BẢO MẬT của GitHub (Dependabot security updates) vẫn hoạt động độc lập với cấu hình này.
# Muốn bật lại cập nhật định kỳ khi phát triển tiếp: đặt lại giới hạn (ví dụ 3) và, nếu muốn tránh bản lớn, thêm
#   ignore: [{ dependency-name: "*", update-types: ["version-update:semver-major"] }]
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
