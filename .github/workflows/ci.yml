name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres thật cho test tích hợp: mỗi lần chạy test tự tạo database riêng (TEST_PG_SERVER_URL)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_PG_SERVER_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Khóa mã hóa CHỈ CHO CI (32 byte base64). Môi trường thật phải đặt MASTER_KEY riêng.
      MASTER_KEY: cmVudHByby1jaS10ZXN0LWtleS1ub3QtZm9yLXByb2Q=

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
